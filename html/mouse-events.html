<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Mouse Events - All in One Example</title>
  <link rel="stylesheet" href="/css/mouse-events.css">
</head>
<body>
  <h1>Mouse Events All-in-One Demo</h1>
  <p class="subtitle">
    Move your mouse over each box below to test the different mouse events.
  </p>

  <div class="grid">
    <div id="clickCard" class="card">
      1. Click / Double Click Me
    </div>

    <div id="pressCard" class="card">
      2. Press & Hold Me
    </div>

    <div id="hoverCard" class="card">
      3. Mouse Over / Out
    </div>

    <div id="enterCard" class="card">
      4. Mouse Enter / Leave
    </div>

    <div id="contextCard" class="card">
      5. Right Click Me
    </div>

  </div>

  <div id="trackBox">
    6. Move Mouse Here (X: 0, Y: 0)
  </div>

  <div id="wheelBox">
    7. Scroll Mouse Wheel Here (Size: 100%)
  </div>
  <script src="/js/mouse-events.js"></script>
</body>
</html>

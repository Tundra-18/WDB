<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Styling Example</title>
</head>
<body>

    <h2>Example 1: Style on &lt;ul&gt;</h2>

    <ul style="background-color: lightblue; color: darkblue; padding: 20px;">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>

    <hr>

    <h2>Example 2: Style on &lt;li&gt;</h2>

    <ul>
        <li style="background-color: lightcoral; color: darkblue;">HTML</li>
        <li style="background-color: lightgreen; color: darkgreen;">CSS</li>
        <li style="background-color: gold; color: black;">JavaScript</li>
    </ul>

</body>
</html>

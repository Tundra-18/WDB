<!DOCTYPE html>
<html>
<head>
    <title>Grid Layout Example</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        *{
            box-sizing: border-box;
        }

        body{
            margin: 0;
            font-family: Arial;
        }

        .container{
            display: grid;

            grid-template-areas:
                "header header header"
                "left content right"
                "footer footer footer";

            grid-template-columns: 20% 60% 20%;
        }

        .header{
            grid-area: header;
            background: #3498db;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .left{
            grid-area: left;
            background: #f1f1f1;
            padding: 20px;
            height: 300px;
        }

        .content{
            grid-area: content;
            padding: 20px;
            height: 300px;
        }

        .right{
            grid-area: right;
            background: #f1f1f1;
            padding: 20px;
            height: 300px;
        }

        .footer{
            grid-area: footer;
            background: #333;
            color: white;
            text-align: center;
            padding: 15px;
        }

    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <h1>My Grid Layout</h1>
        </div>

        <div class="left">
            <h3>Left Sidebar</h3>
        </div>

        <div class="content">
            <h2>Main Content</h2>
            <p>This page uses CSS Grid layout.</p>
        </div>
        <div class="right">
            <h3>Right Sidebar</h3>
        </div>

        <div class="footer">
            <p>Footer Section</p>
        </div>
    </div>
</body>
</html>

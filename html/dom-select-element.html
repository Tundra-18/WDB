<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>querySelector Demo</title>
</head>
<body>

    <h1 id="main-heading">Welcome to JavaScript</h1>

    <p>This is the first paragraph.</p>

    <div class="card">
        <h3>Card 1</h3>
        <p>This is the first card.</p>
    </div>

    <div class="card">
        <h3>Card 2</h3>
        <p>This is the second card.</p>
    </div>

    <div class="card">
        <h3>Card 3</h3>
        <p>This is the third card.</p>
    </div>

    <script>
        const mainHeading = document.querySelector('#main-heading');


        const firstCard = document.querySelector('.card'); 
        const allCards = document.querySelectorAll('.card'); 

        const firstParagraph = document.querySelector('p');

        console.log(mainHeading);
        console.log(firstCard);
        console.log(allCards);
        console.log(firstParagraph);

        console.log("-----------------------------");

        console.log(mainHeading.textContent);      // Welcome to JavaScript
        console.log(firstCard.textContent);        // Card 1 ...
        console.log(firstParagraph.textContent);   // This is the first paragraph.
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colored City Cards</title>
    <style>
        div {
            width: 1000px;
            margin: auto;
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 20px;
            font-family: sans-serif;
        }
        h2 { margin-top: 0; color: #333; }

        .london { background-color: #e3f2fd; border-color: #2196f3; }
        .oslo   { background-color: #f1f8e9; border-color: #8bc34a; }
        .rome   { background-color: #fff3e0; border-color: #ff9800; }
    </style>
</head>
<body>

    <div class="london">
        <h2>London</h2>
        <p>London is the capital city of England.</p>
        <p>London has over 9 million inhabitants.</p>
    </div>

    <div class="oslo">
        <h2>Oslo</h2>
        <p>Oslo is the capital city of Norway.</p>
        <p>Oslo has over 700,000 inhabitants.</p>
    </div>

    <div class="rome">
        <h2>Rome</h2>
        <p>Rome is the capital city of Italy.</p>
        <p>Rome has over 4 million inhabitants.</p>
    </div>

</body>
</html>

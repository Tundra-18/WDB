<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Borders Example</title>

    <!-- External CSS File -->
    <link rel="stylesheet" href="/css/css-borders.css">
</head>
<body>

    <div class="box solid-border">
        <h3>Solid Border</h3>
        <p>This box has a 3px solid dark border on all sides.</p>
    </div>

    <div class="box dashed-round-border">
        <h3>Dashed & Rounded Border</h3>
        <p>
            This box has a dashed orange border and rounded corners using
            <code>border-radius</code>.
        </p>
    </div>

    <div class="box bottom-border-only">
        <h3>Bottom Border Only</h3>
        <p>
            This box only has a border at the bottom, creating an underline effect.
        </p>
    </div>

</body>
</html>

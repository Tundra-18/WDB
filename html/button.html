<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Button Types</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        form { border: 1px solid #ddd; padding: 15px; width: 300px; }
        button { margin: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Button Types Form</h2>

    <form>
        <input type="text" placeholder="Type something here...">
        <br><br>

        <!-- Submit: Send Data -->
        <button type="submit">Submit</button>

        <!-- Reset: Clear Input -->
        <button type="reset">Reset</button>

        <!-- Normal Button: Custom Action -->
        <button type="button" onclick="alert('Action!')">Normal</button>
    </form>

</body>
</html>

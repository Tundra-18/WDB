<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Output Methods</title>
    <style>
        body {
            font-family: Arial;
            margin: 30px;
        }
        #result {
            margin-top: 10px;
            padding: 10px;
            border: 1px solid gray;
        }
        button {
            margin: 5px;
        }
    </style>
</head>
<body>

    <h2>JavaScript Output Methods</h2>

    <h3>1. innerHTML / innerText</h3>

    <button onclick="showHTML()">innerHTML</button>
    <button onclick="showText()">innerText</button>

    <div id="result">Output Here</div>

    <hr>

    <h3>2. document.write()</h3>

    <button onclick="writeDoc()">document.write()</button>

    <hr>

    <h3>3. window.alert()</h3>

    <button onclick="showAlert()">Alert</button>

    <hr>

    <h3>4. JavaScript Print</h3>

    <button onclick="window.print()">Print</button>

    <script>
        function showHTML() {
            document.getElementById("result").innerHTML = "Hello Tundra";
        }

        function showText() {
            document.getElementById("result").innerText = "Hello Zaw Ye Naung";
        }

        function writeDoc() {
            document.write("<h1>Hello JavaScript!</h1>");
        }

        function showAlert() {
            window.alert("Hello JavaScript!");
        }
    </script>

</body>
</html>

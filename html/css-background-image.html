<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Background Image Example</title>
    <style>
        body {
            background-image: url("../images/apple.jpg");
            font-family: sans-serif;
            padding: 40px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border: 1px solid #ccc;
        }

        p.pattern-bg {
            background-image: url("../images/dollar.jpg");
            color: darkblue;
            padding: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>CSS Background Image Demo</h2>
        <p>The entire web page body is using a light cream paper background image. 
            It does not disturb the text.</p>
        
        <p class="pattern-bg">
            <b>
                This specific paragraph has its own dark background image. 
                Because the image is dark, we changed the text color to white 
                to ensure it is easily readable!
            </b>
            
        </p>
    </div>

</body>
</html>

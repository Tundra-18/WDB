<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID Selector Demo</title>
    <style>
        #my-header {
            background: lightblue;
            padding: 40px;
            text-align: center;
        }

        #main-content {
            background: lightgreen;
            margin: 20px auto;
            padding: 20px;
            width: 80%;
        }
    </style>
</head>
<body>

    <h1 id="my-header">Tundra Academy</h1>

    <div id="main-content">
        <h2>Welcome, Tundra</h2>
        <p>This section is styled using a unique ID. 
            IDs are great for major layout pieces like headers, 
            footers, or main wrappers.</p>
    </div>

</body>
</html>

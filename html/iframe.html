<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML iframe Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: pink;
        }
        .container {
            max-width: 800px;
            background: lightblue;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        iframe {
            margin-top: 15px;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>HTML iframe Usage Example</h2>
        <p>The window below uses the tag to embed the Wikipedia website inside the current page.</p>

        <!-- iframe Structure blah lbah -->
        <iframe 
            src="https://en.wikipedia.org/wiki/Main_Page" 
            title="Wikipedia Main Page" 
            width="100%" 
            height="450" 
            style="border: 2px solid #0b29d1;">
        </iframe>
        
        <p>
            <small>* Note: For security reasons, some major websites restrict or block their 
            content from being embedded inside an iframe on other websites.</small>
        </p>
    </div>

</body>
</html>

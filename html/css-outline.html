<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Outline</title>
    <style>
        .box {
            width: 150px;
            padding: 15px;
            margin: 30px;
            background: lightblue;
            border: 3px solid blue;
            
            outline: 4px solid red;
            outline-offset: 5px;
        }
    </style>
</head>
<body>
    <div class="box">Box with Outline</div>
    <div class="box" style="outline: none;">Box without Outline</div>
</body>
</html>

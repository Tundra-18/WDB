<!DOCTYPE html>
<html>
<head>
    <title>Flexbox Layout</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>

        *{
            box-sizing: border-box;
        }

        body{
            margin: 0;
            font-family: Arial;
        }

        .header{
            background: #3498db;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container{
            display: flex;
        }

        .left{
            width: 20%;
            background: #f1f1f1;
            padding: 20px;
            height: 300px;
        }

        .content{
            width: 60%;
            padding: 20px;
            height: 300px;
            background: white;
        }

        .right{
            width: 20%;
            background: #f1f1f1;
            padding: 20px;
            height: 300px;
        }

        .footer{
            background: #333;
            color: white;
            text-align: center;
            padding: 15px;
        }

    </style>
</head>

<body>

    <div class="header">
        <h1>My Flexbox Layout</h1>
    </div>

    <div class="container">

        <div class="left">
            <h3>Left Sidebar</h3>
            <p>Menu items here</p>
        </div>

        <div class="content">
            <h2>Main Content</h2>

            <p>
                This layout uses Flexbox.
                Elements are placed side-by-side using
                display:flex.
            </p>
        </div>

        <div class="right">
            <h3>Right Sidebar</h3>
            <p>Ads or extra info</p>
        </div>

    </div>

    <div class="footer">
        <p>Footer Section</p>
    </div>

</body>
</html>

<!DOCTYPE html>
<html>

<head>
    <title>Style Attribute Example</title>
</head>

<body style="background-color:powderblue;">

    <h1 style="background-color:white; color:blue; text-align:center; font-family:verdana;">
        Main Heading with Multiple Styles
    </h1>

    <h2 style="font-size:300%; text-align:right;">
        Big Right-Aligned Heading
    </h2>

    <p style="color:red; font-family:courier;">
        This is a red paragraph using Courier font.
    </p>

    <p style="text-align:center; background-color:yellow;">
        This is a centered paragraph with a yellow background.
    </p>

    <p style="font-size:150%; color:green; text-align:justify;">
        This is a justified paragraph with larger text and green color to demonstrate various style combinations in a single element.
    </p>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            text-align: center;
        }
    </style>    
</head>
<body>
    <h2>Weekly Schedule (Column Grouping)</h2>
    <table style="width: 70%;">
        <colgroup>
            <col span="1" style="background-color: #d1e7dd">
            <col span="4" style="background-color: #fff3cd">
            <col span="2" style="background-color: #f8d7da">
        </colgroup>

        <tr>
            <th>Mon</th>
            <th>Tue</th>
            <th>Wed</th>
            <th>Thu</th>
            <th>Fri</th>
            <th>Sat</th>
            <th>Sun</th>
        </tr>
        <tr>
            <td>Work</td>
            <td>Work</td>
            <td>Work</td>
            <td>Work</td>
            <td>Work</td>
            <td>Off</td>
            <td>Off</td>
        </tr>
    </table>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Awesome CSS Styling Example</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/css/css-font-awesome.css">
</head>
<body>
    <div class="card">
        <h2>Font Awesome Icons Demonstration</h2>
        <p>
            The following icons are scalable vectors.
            Their size and color are fully customized using standard
            CSS properties instead of regular image properties.
        </p>
        <div class="icon-group">
            <i class="fas fa-cloud cloud-icon"></i>
            <i class="fas fa-heart heart-icon"></i>
            <i class="fas fa-car car-icon"></i>
            <i class="fas fa-file file-icon"></i>
            <i class="fas fa-bars bars-icon"></i>
        </div>
    </div>
</body>
</html>

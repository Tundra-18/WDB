<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Nav Bar Styling Example</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="/css/css-vertical-navbar.css">
</head>

<body>

    <!-- NAVBAR -->
    <ul class="navbar">
        <li><a class="active" href="#home">Home</a></li>
        <li><a href="css-bootstrap.html">News</a></li>
        <li><a href="#contact">Contact</a></li>
        <li><a href="#about">About</a></li>
    </ul>

    <!-- CONTENT -->
    <div class="container">

        <h2>CSS Fixed Navbar + Scroll Demo</h2>

        <p>
        Scroll down to see the <b>fixed navbar</b> staying in place.
        </p>

        <!-- TABLE -->
        <div class="table-container">
            <table>
                <thead>
                <tr>
                    <th>Firstname</th>
                    <th>Lastname</th>
                    <th>Savings</th>
                </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Peter</td>
                        <td>Griffin</td>
                        <td>$100</td>
                    </tr>
                    <tr>
                        <td>Lois</td>
                        <td>Griffin</td>
                        <td>$150</td>
                    </tr>
                    <tr>
                        <td>Joe</td>
                        <td>Swanson</td>
                        <td>$300</td>
                    </tr>
                    <tr>
                        <td>Glenn</td>
                        <td>Quagmire</td>
                        <td>$95</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- SCROLLING CONTENT -->
        <div class="block b1"></div>
        <div class="block b2"></div>
        <div class="block b3"></div>
        <div class="block b4"></div>
        <div class="block b5"></div>

    </div>

</body>
</html>

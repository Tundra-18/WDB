<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emojis</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            text-align: center;
        }
        .emoji-box {
            display: inline-block;
            margin: 15px;
            padding: 10px;
            border: 5px solid #ccc;
            font-size: 40px; /* emoji size */
        }
        .code-text {
            font-size: 20px;
            color: gray;
            display: block;
        }
    </style>
</head>
<body>
    
    <h1>HTML Emojis</h1>

    <div class="emoji-box">
        &#128512;
        <span class="code-text">&#128512;</span>
    </div>

    <div class="emoji-box">
        &#128518;
        <span class="code-text">&#128518;</span>
    </div>

    <div class="emoji-box">
        &#128640;
        <span class="code-text">&#128640;</span>
    </div>

    <div class="emoji-box">
        &#127829;
        <span class="code-text">&#127829;</span>
    </div>
</body>
</html>

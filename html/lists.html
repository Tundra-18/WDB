<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>HTML Lists All-in-One Example</title>
</head>

<body>
    <h2>Unordered List (Bullet Points)</h2>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>
    <hr>
    <h2>Ordered List (Numbered)</h2>
    <ol>
        <li>Open Code Editor</li>
        <li>Write HTML Code</li>
        <li>Save and Run in Browser</li>
    </ol>
    <hr>
    <h2>Description List (Terms and Definitions)</h2>
    <dl>
        <dt>Coffee</dt>
        <dd>- Black hot drink</dd>
        <dt>Milk</dt>
        <dd>- White cold drink</dd>
    </dl>
</body>

</html>

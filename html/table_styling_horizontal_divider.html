<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizontal Divider</title>
    <style>
        table {
            width: 50%;
            border-collapse: collapse; 
        }

        tr {
            border-bottom: 1px solid green;
        }

        th, td {
            padding: 10px;
            text-align: left;
        }
    </style>
</head>
<body>

    <h2>Horizontal Divider</h2>

    <table>
        <tr>
            <th>Firstname</th>
            <th>Lastname</th>
            <th>Age</th>
        </tr>
        <tr>
            <td>Zaw</td>
            <td>Ye Naung</td>
            <td>26</td>
        </tr>
        <tr>
            <td>Lwin</td>
            <td>Oo</td>
            <td>24</td>
        </tr>
        <tr>
            <td>Yin Mon</td>
            <td>Nyein Aye</td>
            <td>39</td>
        </tr>
    </table>

</body>
</html>

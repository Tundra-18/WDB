<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Symbol Entities</title>
    <style>
        body {
            font-family: sans-serif;
            font-size: 24px;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background: grey;
        }
        h2 { color: yellow; }
        code { color: #e11d48; font-weight: bold; }
    </style>
</head>
<body>
    <h1>HTML Symbols</h1>

    <h2>1. Law &amp; Tech</h2>
    <p>Copyright: <b>&copy;</b> 2026</p>
    <p>Trademark: Tech <b>&trade;</b></p>
    <p>Tag Code: <code>&lt;h1&gt;</code></p>

    <h2>2. Math &amp; Arrows</h2>
    <p>Summation: <b>&sum;</b></p>
    <p>Infinity: <b>&infin;</b></p>
    <p>Next Page: <b>&rarr;</b></p>

    <h2>3. Games &amp; Weather</h2>
    <p>Heart: <span style="color:red;">&hearts;</span></p>
    <p>Spade: <b>&spades;</b></p>
    <p>Sun: <b><span style="color: gold;">&#9728;</span></b></p>
</body>
</html>

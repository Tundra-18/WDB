<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            width: 100%;
            border: 2px solid #333;
            border-spacing: 20px; 
        }

        th, td {
            border: 1px solid #666;
            background-color: #f9f9f9;
            padding: 20px;
            text-align: center;
        }

        th {
            background-color: #4CAF50;
            color: white;
        }
    </style>
</head>
<body>
    <h2>HTML Table: Padding vs. Spacing</h2>

    <table>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Address</th>
        </tr>
        <tr>
            <td>Zaw Ye Naung</td>
            <td>26</td>
            <td>Insein</td>
        </tr>
        <tr>
            <td>Lwin Oo</td>
            <td>24</td>
            <td>Dagon</td>
        </tr>
    </table>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Path Tutorial</title>
</head>
<body>

    <h1>HTML Image Paths: Absolute Path vs Relative Path</h1>

    <section>
        <h3>1. Absolute Path (External Images)</h3>
        
        <img src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png" 
             alt="Google Logo" 
             width="150">
        
        <p>This image loaded using their <strong>full URL</strong> from external servers.</p>
    </section>

    <hr>

    <section>
        <h3>2. Relative Path (Internal Image)</h3>
        <img src="/images/profile.jpg" alt="Local Profile Picture" width="200">
        
        <p>This image is loaded from a <strong>local folder</strong> within your own website project.</p>
    </section>

</body>
</html>

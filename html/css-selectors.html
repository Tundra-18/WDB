<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors Example</title>
    <style>
        p {
            color: blue;
            font-family: sans-serif;
        }
        #para1 {
            text-align: center;
            color: red;
        }
        .center {
            text-align: center;
        }
        p.main-text {
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1 class="center">CSS Selectors Heading</h1>

    <p>This is a normal paragraph (Element Selector).</p>

    <p id="para1">This is a unique paragraph (ID Selector).</p>

    <p class="main-text">This paragraph uses a specific class.</p>

</body>
</html>
